<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuraciones - AulaHub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="laboratorioStyles.css">
  <style>
      /* Estilos locales para Ajustes */
      .config-container {
          max-width: 800px;
          margin: 0 auto;
      }
      .config-card {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 15px;
          cursor: default;
      }
      .config-info {
          display: flex;
          align-items: center;
          gap: 15px;
      }
      .config-icon {
          color: #164B8A;
          font-size: 28px;
          padding: 10px;
          background-color: #f0f9ff;
          border-radius: 50%;
      }
      .config-details h3 { margin: 0; font-size: 16px; color: #333; }
      .config-details p { margin: 2px 0 0; font-size: 13px; color: #666; }

      .btn-action {
          padding: 8px 16px;
          border: 1px solid #d1d5db;
          background: white;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 500;
          color: #374151;
          transition: background 0.2s;
      }
      .btn-action:hover { background: #f9fafb; border-color: #9ca3af; }
  </style>
</head>
<body>
    <header class="header"></header>
    <div class="toasts"></div>

    <div class="content">
        <h2>Configuraciones</h2>
        
        <div class="config-container">
            <h4 style="margin-bottom: 15px; color: #666; text-transform: uppercase; font-size: 12px;">Cuenta</h4>

            <div class="card config-card">
                <div class="config-info">
                    <span class="material-symbols-outlined config-icon">mail</span>
                    <div class="config-details">
                        <h3>Correo Electrónico</h3>
                        <p id="user-email">Cargando...</p>
                    </div>
                </div>
            </div>

            <div class="card config-card">
                <div class="config-info">
                    <span class="material-symbols-outlined config-icon">lock_reset</span>
                    <div class="config-details">
                        <h3>Contraseña</h3>
                        <p>Restablecer contraseña mediante correo</p>
                    </div>
                </div>
                <button id="btnResetPassword" class="btn-action">Enviar correo</button>
            </div>
        </div>
    </div>

    <footer></footer>

    <script type="module" src="./Firebase-Config.js"></script>
    <script type="module" src="./usuarios.js"></script>
    <script type="module" src="./configuraciones.js"></script>
</body>
</html>
