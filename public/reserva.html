<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Reservas</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">
</head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body{
      background:#f5f5f5;
      font-family: Arial, sans-serif;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 20px;
      background:#fff; border-bottom:1px solid #ddd;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }
    .menu-icon,.bell-icon,.profile{
        font-size:22px;
        cursor:pointer; 
    }

    .asignaraula{
    text-align:center;
    margin:12px auto;
    font-family:'Poppins', system-ui, Arial, sans-serif;
    color:#111827;           
    }

    .horario{
    text-align:center;
    margin-bottom: auto;
    font-family:'Poppins', system-ui, Arial, sans-serif;
    color:#111827;  
    }

    .asignaraula label{
    display:block;
    font-weight:600;
    font-size:13px;
    line-height:1.25;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#000000;         
    margin-bottom:6px;
    }

    .horario label{
    display:block;
    font-weight:600;
    font-size:13px;
    line-height:1.25;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#000000;          
    margin-bottom:6px;
    }

    .asignaraula select{
    font-size:14px;
    font-weight:500;
    line-height:1.25;
    color:#111827;
    }

    .horario select{
    font-size:14px;
    font-weight:500;
    line-height:1.25;
    color:#111827;
    }

    .calendar{
      width:350px;
      background:#fff;
      margin:16px auto;
      border-radius:8px;
      box-shadow:0 10px 29px -7px rgba(63,63,63,0.48);
      overflow:hidden;
    }

    .calendar-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 8px;
    }
    .calendar-header button{
      background:transparent;
      border:none;
      cursor:pointer;
      font-size:18px;
      width:40px;
      height:40px;
      border-radius:50%;
    }
    #prevBtn:hover,#nextBtn:hover{
        background:#ddd !important;
        transition: background-color .2s; 
    }

    #currentMonth{
      font-family:'Poppins', system-ui;
      font-size:18px;
      text-transform:capitalize;
    }

    .calendar-days{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:0;
      padding:6px 8px 0 8px;
      font-family:'Poppins', system-ui;
      font-size:12px;
      color:#6b7280;
      text-transform:uppercase;
      letter-spacing:.06em;
    }
    .calendar-weekday{
      text-align:center;
      padding:8px 0;
      font-weight:600;
      user-select:none;
    }

    .calendar-body{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      padding:8px;
    }

    .calendar-day{
      border:1px solid #fff;
      border-radius:50%;
      padding:10px;
      margin:5px;
      text-align:center;
      cursor:pointer;
    }
    .calendar-day.empty{
        cursor:default;
        visibility:hidden; 
    }

    .calendar-day:hover{
        background-color:#ddd !important;
        transition:background-color .2s; 
    }
    .calendar-day.selected{
        border:1px solid #003879d0;
        background-color:rgba(70,201,240);
    }
    .calendar-day.range{
        border:1px solid #007900d0;
        background-color:rgba(86,238,86);
    }

    #selectedDates{
        font-family:'Poppins', system-ui;
        text-align:center; 
    }
  </style>
<body>
    <header>
        <div class="menu-icon">
            <img src="img/lista de tareas.png">
        </div>
        <div class="bell-icon">
            <img src="img/campana.png">
        </div>
        <div class="profile">
            <img src="img/usuario.png">
        </div>
    </header>
    <div class="asignaraula">
        <label for="aulas">Aula</label>
        <select name="aulas" id="aulas">
            <option value="option1">Salon 1</option>
            <option value="opcion2">Salon 2</option>
            <option value="opcion3">Salon 3</option>
        </select>
    </div>
    <div class="horario">
        <label for="turno">Horario</label>
        <select name="turno" id="turno">
            <option value="turno1">Matutino</option>
            <option value="turno2">Despertino</option>
        </select>
    </div>
    <h3 id="selectedDates">Fechas seleccionadas:</h3>

    <div class="calendar">
        <div class="calendar-header">
            <button id="prevBtn" class="calendar-btn"><i class="fas fa-angle-left"></i></button>
            <h2 id="currentMonth"></h2>
            <button id="nextBtn" class="calendar-btn"><i class="fas fa-angle-right"></i></button>
        </div>
        <div class="calendar-days"></div>
        <div id="calendarBody" class="calendar-body"></div>
    </div>
    <script>
        const currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let startDate = null;
        let endDate = null;

        const calendarDaysHeader = document.querySelector('.calendar-days')
        const calendarBody = document.getElementById('calendarBody');
        const currentMonthElement = document.getElementById('currentMonth');
        const selectedDatesElement = document.getElementById('selectedDates');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        const weekdaynames = ['Lun','Mar','Mie','Jue','Vie','Sab','Dom'];

        function renderCalendar(){
            const jsFirstDay = new Date(currentYear, currentMonth, 1).getDay();
            const firstDayIndex = (jsFirstDay - 1 + 7) % 7;

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            currentMonthElement.textContent = new Date(currentYear, currentMonth, 1).toLocaleDateString('es-MX',{month: 'long', year: 'numeric'});

            let days = '';

            for (let i = 0; i < firstDayIndex; i++) {
                days += `<div class="calendar-day empty"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const date = new Date(currentYear, currentMonth, i);
                const className = getDayClassName(date);
                days += `<div class="calendar-day ${className}" onclick="selectDate(${i})">${i}</div>`;
            }

            calendarBody.innerHTML = days;
        }

    function changeMonth(delta){
      currentMonth += delta;
      if (currentMonth < 0){
        currentMonth = 11;
        currentYear -= 1;
      } else if (currentMonth > 11){
        currentMonth = 0;
        currentYear += 1;
      }
      renderCalendar();
    }

    function renderWeekdays(){
        calendarDaysHeader.innerHTML = weekdaynames
        .map(name => `<div class="calendar-weekday">${name}</div>`).join('');
    }

        prevBtn.addEventListener('click',()=>{
            currentMonth--;
            renderCalendar();
        });
        nextBtn.addEventListener('click',()=>{
            currentMonth++;
            renderCalendar();
        });

        window.selectDate = function(day){
            const clickedDate = new Date(currentYear, currentMonth, day);
            if (!startDate || endDate){
                startDate = clickedDate;
                endDate = null;
            } else if (clickedDate < startDate){
                startDate = clickedDate;
            } else if (clickedDate > startDate){
                endDate = clickedDate;
            }

            renderCalendar();
            updateSelectedDates();
        }

        function updateSelectedDates(){
            if(startDate && endDate){
                selectedDatesElement.textContent = `Fechas seleccionadas: ${formatDate(startDate)} - ${formatDate(endDate)}`;
            } else if (startDate){
                selectedDatesElement.textContent = `Fechas seleccionadas: ${formatDate(startDate)}`;
            } else {
                selectedDatesElement.textContent = `Fechas seleccionadas:`;
            }
        }

        function getDayClassName(date){
            if (startDate && date.toDateString() === startDate.toDateString()){
                return 'selected';
            }
            if (endDate && date.toDateString() === endDate.toDateString()){
                return 'selected';
            }
            if (startDate && endDate && date > startDate && date < endDate){
                return 'range';
            }
            return '';
        }

        function formatDate(date){
            const d = String(date.getDate()).padStart(2,'0');
            const m = String(date.getMonth()+1).padStart(2,'0');
            const y = date.getFullYear();
            return `${d}/${m}/${y}`;
        }

        renderWeekdays();
        renderCalendar();
        updateSelectedDates();
    </script>
</body>
</html>
