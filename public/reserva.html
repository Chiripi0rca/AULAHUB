<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Reservas</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="datestyles.css">
</head>
<body>
    <header class="header"></header>
    <div class="toasts"></div>
    <div class="ImgFoto">
        <img src="https://img.freepik.com/foto-gratis/vacant-modern-workspace-with-computers_482257-127194.jpg" alt="aula">
    </div>

    <div class="form-container">
        <div class="form-row">
            <div class="input-group">
                <label>Aula Seleccionada</label>
                <input type="text" id="aulaDisplay" readonly class="input-moderno input-locked">
            </div>
            <div class="input-group">
                <label for="turno">Turno</label>
                <select name="turno" id="turno" class="input-moderno">
                    <option value="Matutino">Matutino</option>
                    <option value="Vespertino">Vespertino</option>
                </select>
            </div>
        </div>

        <div class="horas-wrapper">
            <label>Selecciona las horas:</label>
            <div id="containerHoras" class="grid-horas"></div>
        </div>

        <div class="form-row">
            <div class="input-group">
                <label for="materia">Materia</label>
                <input type="text" id="materia" placeholder="Ej. Programación Web" class="input-moderno">
            </div>
            <div class="input-group">
                <label for="grupo">Grupo</label>
                <input type="text" id="grupo" placeholder="Ej. 3-01" class="input-moderno">
            </div>
        </div>
    </div>

    <h3 id="selectedDates">Fechas seleccionadas:</h3>
    <div class="calendar">
        <div class="calendar-header">
            <button id="prevBtn"><i class="fas fa-angle-left"></i></button>
            <h2 id="currentMonth"></h2>
            <button id="nextBtn"><i class="fas fa-angle-right"></i></button>
        </div>
        <div class="calendar-days"></div>
        <div id="calendarBody" class="calendar-body"></div>
    </div>

    <div class="aceptar"><button type="button" id="btnPreReservar">Continuar</button></div>

    <div id="modalConfirmacion" class="modal-overlay">
        <div class="modal-content">
            <h3>Confirmar Reserva</h3>
            <div class="modal-details">
                <p><strong>Aula:</strong> <span id="confAula"></span></p>
                <p><strong>Materia:</strong> <span id="confMateria"></span></p>
                <p><strong>Grupo:</strong> <span id="confGrupo"></span></p>
                <p><strong>Turno:</strong> <span id="confTurno"></span></p>
                <p><strong>Fechas:</strong> <span id="confFechas"></span></p>
                <p><strong>Horas:</strong> <span id="confHoras"></span></p>
            </div>
            <div class="modal-actions">
                <button id="btnCancelar" class="btn-cancel">Cancelar</button>
                <button id="btnEnviarReserva" class="btn-confirm">Confirmar</button>
            </div>
        </div>
    </div>
    <footer></footer>
    <script type="module" src="funcionDates.js"></script>
    <script type="module" src="./Firebase-Config.js"></script>
    <script type="module" src="./usuarios.js"></script>
</body>
</html>
