<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Reservas</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">

    <!-- estilos de google -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
    <link rel="stylesheet" href="datestyles.css">
</head>
<body>
     <!-- encabezado -->
    <header class="header">
        <nav>
            <ul>
                <li class="abrirmenu">
                    <a href="#">
                        <span class="material-symbols-outlined">menu_open</span>
                    </a>
                    <div class="submenu">
                        <ul>
                            <li><a href="aulas.html">Menu Principal</a></li>
                            <li><a href="#">Configuraciones</a></li>
                            <li><a href="#">Mis reservas</a></li>
                            <li><a href="ayuda.html">Ayuda</a></li>
                            <li><a href="#" id="logout">Cerrar sesion</a></li>
                        </ul>
                    </div>
                </li>
            </ul>
        </nav>
        <nav>
            <ul>
                <div class="notificacion">
                    <span class="material-symbols-outlined">notifications</span>
                </div>
            </ul>
        </nav>
        <nav>
            <ul>
                <li class="usuario">
                    <a href="#">
                        <img src="img/usuario.png" id="preview" alt="avatar"/>
                    </a>
                    <div class="subusuario">
                        <ul>
                            <li><div id="userinfo"></div></li>
                            <input type="file" id="fileInput" accept="image/*" style="display:none;">
                            <li><button id="uploadBtn">Subir imagen</button></li>
                            </li>
                        </ul>
                    </div>
                </li>
            </ul>
        </nav>
    </header>
    <!-- Alerta -->
    <div class="toasts"></div>

    <!-- Foto -->
    <div class="ImgFoto">
        <img src="https://img.freepik.com/foto-gratis/vacant-modern-workspace-with-computers_482257-127194.jpg?semt=ais_hybrid&w=740&q=80" alt="aula">
    </div>
    <!-- textBox -->
    <div class="alinear">
    <div class="asignaraula">
        <label for="aulas">Aula</label>
        <select name="aulas" id="aulas">
            <option value="option1">Ninguno</option>
            <option value="option1">Salon 1</option>
            <option value="opcion2">Salon 2</option>
            <option value="opcion3">Salon 3</option>
        </select>
    </div>
    <div class="horario">
        <label for="turno">Horario</label>
        <select name="turno" id="turno">
            <option value="option1">Ninguno</option>
            <option value="turno1">Matutino</option>
            <option value="turno2">Vespertino</option>
        </select>
    </div>
    </div>

     <!-- calendario -->
    <h3 id="selectedDates">Fechas seleccionadas:</h3>

    <div class="calendar">
        <div class="calendar-header">
            <button id="prevBtn" class="calendar-btn"><i class="fas fa-angle-left"></i></button>
            <h2 id="currentMonth"></h2>
            <button id="nextBtn" class="calendar-btn"><i class="fas fa-angle-right"></i></button>
        </div>
        <div class="calendar-days"></div>
        <div id="calendarBody" class="calendar-body"></div>
    </div>

    <!-- Boton para reservar -->

    <div class="aceptar">
        <button type="button" id="reservo"> Reservar </button>
    </div>
    <script type="module" src="funcionDates.js"></script>
    <script type="module" src="./Firebase-Config.js"></script>
    <script type="module" src="./usuarios.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
</body>
</html>
